# /etc/nginx/default.d/fika.conf — included inside the default server block of /etc/nginx/nginx.conf
# Replace each <...-HOST> with that server's DNS name, e.g. menu.fika.agenticengg.online
# nginx looks the names up when it starts or reloads: after a DNS change, run `systemctl reload nginx`.

server_tokens off;

# every request gets a unique id, sent to the services and back to the browser
add_header X-Request-Id $request_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;
proxy_hide_header X-Request-Id;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;   # 504 if a service takes longer than this

# the trailing / removes the /api/<service> part:
# /api/menu/cafes -> http://<MENU-HOST>:8080/cafes
location /api/menu/     { proxy_pass http://<MENU-HOST>:8080/; }
location /api/user/     { proxy_pass http://<USER-HOST>:8080/; }
location /api/basket/   { proxy_pass http://<BASKET-HOST>:8080/; }
location /api/delivery/ { proxy_pass http://<DELIVERY-HOST>:8080/; }
location /api/payment/  { proxy_pass http://<PAYMENT-HOST>:8080/; }

# when nginx itself cannot reach a service, answer in JSON like the services do
error_page 502 = @bad_gateway;
error_page 504 = @gateway_timeout;
location @bad_gateway {
    default_type application/json;
    return 502 '{"message":"service not reachable (502 Bad Gateway from nginx)"}';
}
location @gateway_timeout {
    default_type application/json;
    return 504 '{"message":"service did not answer in time (504 Gateway Timeout from nginx)"}';
}

# nginx's own connection counters
location = /health {
    stub_status on;
    access_log off;
}

# the app is one page: /cafe/bullhornan, /basket, /status ... all return index.html
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
location /assets/ {
    expires 1h;
}
